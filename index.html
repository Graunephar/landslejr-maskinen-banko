<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BANKO — Røgvenderrapporten · Seniorfestival 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0c0906; overflow:hidden; }
  body{
    --orange:#ff6b1a; --orange-deep:#e0490f; --glow:#ff922e; --hot:#ffb257;
    --teal:#3fe6cc; --party:#c94fd6; --party2:#42d6c0;
    --bg:#140f0b; --panel:#1e1712; --plate:#efe8dd; --plate-blank:#cdbfae; --ink:#181310;
    --bezel1:#d8c9a6; --bezel2:#b39a68; --glowbg:#43301d; --sub:#a98d68; --btnglow:#ff922e;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }

  /* --- Stage: always-landscape (ADR-10). Portrait → rotate whole app 90° via CSS. --- */
  .stage{
    position:relative; overflow:hidden;
    width:100vw; height:100vh; width:100dvw; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% -20%,var(--glowbg) 0%,var(--bg) 55%); transition:background .45s;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  }
  /* Natural landscape: fill the wide screen. Panel takes the full viewport height
     (never under the address bar), grid flexes to fill, cells drop the square lock
     so numbers grow big instead of leaving black side-bars. Capped for desktop. */
  @media (orientation:landscape){
    .stage .bezel{ width:100%; max-width:min(1100px, 96vw); height:min(calc(100dvh - 16px), 560px); }
    .panel{ display:flex; flex-direction:column; height:100%; }
    .stage .grid{ flex:1 1 auto; min-height:0; min-width:0; grid-template-columns:repeat(9,minmax(0,1fr)); }
    .stage .cell{ aspect-ratio:auto; }   /* .stage bumps specificity over base .grid / .cell rules that come later in source */
  }
  @media (orientation:portrait){
    .stage{
      position:fixed; top:0; left:100%;
      width:100vh; height:100vw; width:100dvh; height:100dvw;
      transform:rotate(90deg); transform-origin:top left;
      padding:max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));
    }
    /* Rotated machine is landscape-shaped → fill layout so cells fit the (short) height instead of overflowing.
       Machine width relates to screen height (dvh), machine height to screen width (dvw). */
    .stage .bezel{ width:100%; max-width:min(1100px, 96dvh); height:min(calc(100dvw - 16px), 560px); }
    .panel{ display:flex; flex-direction:column; height:100%; }
    .stage .grid{ flex:1 1 auto; min-height:0; min-width:0; grid-template-columns:repeat(9,minmax(0,1fr)); }
    .stage .cell{ aspect-ratio:auto; }
  }
  /* Small machines (old/small phones): the full-size 2× chrome + centered title overflows the rail.
     Scale the top chrome down so the title never collides with the controls. Grid stays big. */
  @media (orientation:portrait) and (max-height:720px), (orientation:landscape) and (max-width:760px){
    .stage .rail{ padding:3px 40px 6px; gap:6px; }
    .stage .lgroup, .stage .rgroup{ gap:6px; }
    .stage .crt{ width:68px; height:34px; }
    .stage .crt-num{ font-size:18px; } .stage .crt-num span{ font-size:12px; }
    .stage .scan{ height:10px; }
    .stage .knob{ width:22px; height:22px; } .stage .tgl{ width:14px; height:22px; } .stage .redbtn{ width:22px; height:22px; }
    .stage .fader{ width:36px; height:22px; }
    .stage .title{ font-size:14px; letter-spacing:.1em; text-indent:.1em; }
    .stage .sub{ font-size:6px; letter-spacing:.14em; text-indent:.14em; }
    .stage .serial{ font-size:9.5px; }
    .stage .screw{ width:28px; height:28px; }
    .stage .s1{top:6px;left:6px}.stage .s2{top:6px;right:6px}.stage .s3{bottom:6px;left:6px}.stage .s4{bottom:6px;right:6px}
  }
  /* Ultra-small (ancient phones, ~320×480): shrink the chrome one more step */
  @media (orientation:portrait) and (max-height:520px), (orientation:landscape) and (max-width:560px){
    .stage .rail{ padding:3px 34px 5px; gap:5px; }
    .stage .lgroup, .stage .rgroup{ gap:5px; }
    .stage .crt{ width:56px; height:28px; } .stage .crt-num{ font-size:15px; } .stage .crt-num span{ font-size:9px; }
    .stage .knob{ width:20px; height:20px; } .stage .tgl{ width:13px; height:20px; } .stage .redbtn{ width:20px; height:20px; }
    .stage .fader{ width:30px; height:20px; }
    .stage .title{ font-size:11px; letter-spacing:.04em; text-indent:.04em; }
    .stage .sub{ font-size:5.5px; }
    .stage .serial{ font-size:8.5px; }
    .stage .screw{ width:24px; height:24px; }
    .stage .s1{top:5px;left:5px}.stage .s2{top:5px;right:5px}.stage .s3{bottom:5px;left:5px}.stage .s4{bottom:5px;right:5px}
  }

  .bezel{ background:linear-gradient(180deg,var(--bezel1),var(--bezel2)); transition:background .45s; padding:7px; border-radius:15px; max-width:820px; width:100%;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.55); }
  .panel{ position:relative; background:var(--panel); border:1px solid #3a2c1e; border-radius:9px;
    padding:11px 14px 12px; box-shadow:inset 0 0 46px rgba(0,0,0,.6); overflow:hidden; transition:box-shadow .3s,background .45s; }
  .panel.party{ animation:disco 1.1s linear infinite; }
  @keyframes disco{
    0%{ box-shadow:inset 0 0 60px rgba(201,79,214,.34),0 0 0 2px rgba(255,107,26,.5) }
    33%{ box-shadow:inset 0 0 60px rgba(63,214,192,.34),0 0 0 2px rgba(201,79,214,.6) }
    66%{ box-shadow:inset 0 0 60px rgba(255,107,26,.4),0 0 0 2px rgba(63,214,192,.6) }
    100%{ box-shadow:inset 0 0 60px rgba(201,79,214,.34),0 0 0 2px rgba(255,107,26,.5) }
  }

  .screw{ position:absolute; z-index:5; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #f2e9d2 0%, #dccaa2 24%, #ab9569 60%, #6f5a3b 88%, #4c3c26 100%);
    border:1px solid #43331f;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.55), inset 0 -4px 7px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.55); }
  .screw::before, .screw::after{ content:""; position:absolute; top:50%; left:17%; right:17%; height:11%;
    background:linear-gradient(#2c2013,#150e07); border-radius:3px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.22); }
  .screw::before{ transform:translateY(-50%) rotate(35deg); }
  .screw::after{ transform:translateY(-50%) rotate(125deg); }
  .s1{top:7px;left:7px}.s2{top:7px;right:7px}.s3{bottom:7px;left:7px}.s4{bottom:7px;right:7px}

  .rail{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 50px 8px; }
  .lgroup, .rgroup{ display:flex; align-items:center; gap:12px; flex:none; }
  .crt{ position:relative; width:104px; height:52px; border-radius:8px; background:#04120f; flex:none; border:2px solid #3a2c1e; box-shadow:inset 0 0 14px rgba(63,230,204,.35); overflow:hidden; }
  .crt-grid{ position:absolute; inset:0; opacity:.32; background-image:linear-gradient(var(--teal) 1px,transparent 1px),linear-gradient(90deg,var(--teal) 1px,transparent 1px); background-size:12px 12px; }
  .crt-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--teal); font-weight:800; font-size:28px; text-shadow:0 0 8px var(--teal) }
  .crt-num span{ color:#6f8f88; font-size:18px }
  .scan{ position:absolute; left:0; right:0; height:14px; background:linear-gradient(rgba(63,230,204,.18),transparent); animation:scan 2.6s linear infinite }
  @keyframes scan{ 0%{ top:-14px } 100%{ top:52px } }
  .knobs{ display:flex; align-items:center; gap:12px; flex:none }
  .knob{ width:32px; height:32px; border-radius:50%; position:relative; background:radial-gradient(circle at 38% 30%,#4a3a2a,#181109 78%); border:2px solid #4a3a2a }
  .knob::after{ content:""; position:absolute; left:50%; top:4px; width:4px; height:12px; background:var(--hot); border-radius:2px; box-shadow:0 0 6px var(--btnglow); transform-origin:bottom }
  .k1::after{ transform:translateX(-50%) rotate(-40deg) } .k3::after{ transform:translateX(-50%) rotate(40deg) }
  .tgl{ width:20px; height:32px; border-radius:3px; background:#241a12; border:2px solid #4a3a2a; position:relative }
  .tgl.on::after{ content:""; position:absolute; left:3px; right:3px; top:3px; height:12px; border-radius:2px; background:var(--hot); box-shadow:0 0 6px var(--btnglow) }
  .tgl.flip{ animation:tglflip .22s ease }
  @keyframes tglflip{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.18) } }
  .redbtn{ width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#ff6a5a,#a01508 76%); border:3px solid #2a0d07; box-shadow:0 0 12px rgba(220,40,20,.5) }
  /* New control types (right cluster, balance the left) — distinct from knob/toggle/CRT/redbtn */
  .fader{ position:relative; width:52px; height:30px; border-radius:4px; background:#181109; border:2px solid #4a3a2a; box-shadow:inset 0 1px 4px rgba(0,0,0,.7); flex:none; cursor:pointer }
  .fader::before{ content:""; position:absolute; left:5px; right:5px; top:50%; height:3px; transform:translateY(-50%); background:#3a2c1e; border-radius:2px }
  .fader::after{ content:""; position:absolute; top:3px; bottom:3px; left:58%; width:9px; border-radius:3px; background:linear-gradient(#e2d3ad,#8a7550); box-shadow:0 0 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5) }
  .fader.slid::after{ animation:faderslide .4s ease }
  @keyframes faderslide{ 0%{ left:58% } 50%{ left:14% } 100%{ left:58% } }

  .nameplate{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; line-height:1; z-index:2; pointer-events:none; }
  .nameplate .title, .nameplate .sub{ pointer-events:auto; }
  .title{ color:var(--orange); font-weight:800; font-size:20px; letter-spacing:.26em; text-indent:.26em; text-shadow:0 0 16px rgba(255,107,26,.6); cursor:pointer; user-select:none; white-space:nowrap; }
  .title.flick{ animation:titleflick .55s steps(1); }
  @keyframes titleflick{ 0%{opacity:1} 15%{opacity:.25} 30%{opacity:1} 45%{opacity:.35} 60%{opacity:1} 75%{opacity:.5} 100%{opacity:1} }
  .title.blast{ animation:titleblast .7s ease; }
  @keyframes titleblast{
    0%{ transform:none; filter:none }
    25%{ transform:scale(1.2) rotate(-2deg); filter:brightness(1.5) }
    50%{ transform:scale(1.12) rotate(2deg); filter:hue-rotate(120deg) brightness(1.5) }
    75%{ transform:scale(1.16) rotate(-1deg); filter:hue-rotate(250deg) brightness(1.4) }
    100%{ transform:none; filter:none }
  }
  .sub{ color:var(--sub); font-size:8.5px; letter-spacing:.3em; text-indent:.3em; margin-top:4px; white-space:nowrap; pointer-events:auto; cursor:pointer }
  .serial{ flex:none; color:var(--teal); font-weight:800; font-size:12px; letter-spacing:1px; text-shadow:0 0 8px var(--teal); white-space:nowrap }

  .batwrap{ display:flex; align-items:stretch; gap:3px; margin:0 2px 11px; cursor:pointer; }
  .battery{ flex:1; display:flex; gap:2px; padding:3px; background:#0c0906; border:2px solid #4a3a2a; border-radius:5px; box-shadow:inset 0 0 6px #000; }
  .battery i{ flex:1; border-radius:1px; background:#241d15; transition:background .14s,box-shadow .14s }
  .battery i.on.g{ background:#46d97a; box-shadow:0 0 6px #46d97a }
  .battery i.on.a{ background:var(--hot); box-shadow:0 0 6px var(--glow) }
  .battery i.on.r{ background:#ff4d3d; box-shadow:0 0 8px #ff4d3d }
  .nub{ width:5px; align-self:center; height:14px; background:#4a3a2a; border-radius:0 3px 3px 0 }
  .full .battery{ border-color:var(--orange); box-shadow:inset 0 0 6px #000,0 0 14px rgba(255,107,26,.6) }

  /* Secret line = absolute overlay → never reflows the grid. Bigger, centered over the machine. */
  .secret{ position:absolute; left:0; right:0; top:46%; transform:translateY(-50%); z-index:6; text-align:center; padding:0 6%;
    color:#fff; font-size:clamp(22px,5.6vw,40px); font-weight:900; letter-spacing:.06em; line-height:1.15;
    opacity:0; pointer-events:none; transition:opacity .25s;
    text-shadow:0 0 30px var(--glow),0 0 10px var(--orange),0 2px 6px rgba(0,0,0,.9); }
  .secret.show{ opacity:1; }
  .secret.punch{ animation:secpunch .45s ease; }
  @keyframes secpunch{ 0%{transform:translateY(-50%) scale(.6)} 55%{transform:translateY(-50%) scale(1.16)} 100%{transform:translateY(-50%) scale(1)} }
  /* Senior egg — text arrives tilted with its own pop */
  .secret.soul{ transform:translateY(-50%) rotate(-7deg); animation:soulpop .55s cubic-bezier(.2,1.3,.4,1); }
  @keyframes soulpop{ 0%{transform:translateY(-50%) rotate(-7deg) scale(.5);opacity:0} 60%{transform:translateY(-50%) rotate(-7deg) scale(1.12)} 100%{transform:translateY(-50%) rotate(-7deg) scale(1)} }
  /* Aura — new background: warm halo that breathes + gentle rising light (supports the wholesome message) */
  .aura{ position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; transition:opacity .45s; overflow:hidden; }
  .aura.show{ opacity:1; }
  .aura::before{ content:""; position:absolute; inset:-25%; background:radial-gradient(circle at 50% 47%, rgba(255,198,124,.5), rgba(255,120,40,.15) 42%, transparent 68%); animation:auraBreathe 3.2s ease-in-out infinite; }
  .aura::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,226,190,.07) 0 2px, transparent 2px 26px); animation:auraRise 2.4s linear infinite; }
  @keyframes auraBreathe{ 0%,100%{ transform:scale(.9); opacity:.55 } 50%{ transform:scale(1.14); opacity:1 } }
  @keyframes auraRise{ from{ transform:translateY(0) } to{ transform:translateY(-26px) } }

  .grid{ display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(3,1fr); gap:5px; background:#100b07; padding:6px; border-radius:8px; border:1px solid #4a3a2b; container-type:inline-size; }
  .cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:clamp(15px,6.4cqw,38px); font-weight:800; border-radius:6px; position:relative; }
  .cell.num{ background:var(--plate); color:var(--ink); cursor:pointer; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.6); transition:transform .05s,box-shadow .1s,background .12s,color .12s; }
  .cell.num:active{ transform:translateY(2px); box-shadow:inset 0 -1px 0 rgba(0,0,0,.2) }
  .cell.blank{ background:var(--plate-blank); opacity:.26 }
  .cell.lit{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55); background:radial-gradient(circle at 50% 42%,var(--hot) 0%,var(--orange) 58%,var(--orange-deep) 100%); box-shadow:0 0 0 2px color-mix(in srgb,var(--btnglow) 50%,#000),0 0 22px 4px color-mix(in srgb,var(--btnglow) 56%,transparent),inset 0 2px 7px rgba(255,220,180,.6); animation:pulse 2.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 2px color-mix(in srgb,var(--btnglow) 50%,#000),0 0 16px 3px color-mix(in srgb,var(--btnglow) 42%,transparent),inset 0 2px 7px rgba(255,220,180,.6) } 50%{ box-shadow:0 0 0 2px color-mix(in srgb,var(--btnglow) 50%,#000),0 0 28px 7px color-mix(in srgb,var(--btnglow) 63%,transparent),inset 0 2px 7px rgba(255,220,180,.6) } }

  .statusbar{ display:flex; align-items:center; gap:12px; margin-top:12px; padding:0 50px; height:26px }
  .pwr{ width:18px; height:18px; border-radius:50%; background:var(--btnglow); box-shadow:0 0 12px 3px var(--btnglow); animation:breathe 2.4s ease-in-out infinite }
  @keyframes breathe{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  .rivets{ margin-left:24px; display:flex; align-items:center; gap:10px; flex:none; }
  .rivets i{ width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#6b5738,#241a10 78%); box-shadow:inset 0 0 1px #000,0 1px 0 rgba(255,255,255,.08); cursor:pointer; }
  .readout{ margin-left:auto; color:var(--sub); font-size:10px; letter-spacing:.2em; cursor:pointer; white-space:nowrap }
  .readout.tease{ animation:stamp .4s ease; color:var(--hot); text-shadow:0 0 8px var(--glow) }
  .party .pwr{ background:var(--party2); box-shadow:0 0 10px 3px var(--party) }

  /* Debug (?fejlfinding) */
  .dbg{ display:none; gap:8px; align-items:center; margin:8px 2px 0; }
  .dbg.on{ display:flex; }
  .dbg button{ font-family:inherit; font-size:12px; font-weight:800; letter-spacing:.08em; color:#fff; background:radial-gradient(circle at 38% 32%,#ff6a5a,#a01508 76%); border:1.5px solid #2a0d07; border-radius:6px; padding:7px 12px; cursor:pointer; }
  .dbg .info{ color:#a98d68; font-size:10px; }

  /* --- Party overlay (ADR-12): win-type + confetti + return countdown --- */
  /* Confetti is a sibling of the stage and fixed to the viewport, so it is
     never clipped by the sheet and never rotated with it in portrait — paper
     falls down the real screen, not down the machine. */
  .confetti{ position:fixed; inset:0; width:100vw; height:100vh;
    width:100dvw; height:100dvh; pointer-events:none; z-index:60; }
  .win{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(24px,7vh,56px);
    background:rgba(20,15,11,.74); opacity:0; pointer-events:none; transition:opacity .25s; }
  .win.show{ opacity:1; pointer-events:auto; }
  .win .type{ font-size:clamp(34px,9vw,60px); font-weight:900; letter-spacing:.12em; color:#fff; text-align:center;
    text-shadow:0 0 34px var(--glow),0 0 8px var(--orange); transform:rotate(-6deg) scale(.85); transition:transform .25s; }
  .win.show .type{ transform:rotate(-6deg) scale(1); }
  .win .banko{ font-size:clamp(18px,4vw,26px); font-weight:800; letter-spacing:.3em; color:var(--hot); }
  .ret{ width:70%; max-width:420px; }
  .ret .lbl{ text-align:center; color:#e9d9bd; font-size:11px; letter-spacing:.2em; margin-bottom:6px; }
  .ret .track{ height:10px; border-radius:6px; background:#0c0906; border:2px solid #4a3a2a; overflow:hidden; box-shadow:inset 0 0 6px #000; }
  .ret .bar{ height:100%; width:100%; background:linear-gradient(90deg,var(--hot),var(--orange),var(--orange-deep)); }
  .ret .bar.run{ width:0; transition:width 10s linear; }

  /* --- Easter eggs (all on non-functional chrome; never block marking) --- */
  /* A — red button overheat: shake + amber flash */
  .bezel.shake{ animation:shake .5s ease; }
  @keyframes shake{ 0%,100%{transform:translate(0,0)} 20%{transform:translate(-4px,2px) rotate(-.4deg)} 40%{transform:translate(4px,-2px) rotate(.4deg)} 60%{transform:translate(-3px,1px)} 80%{transform:translate(3px,-1px)} }
  .flash{ position:absolute; inset:0; z-index:5; background:var(--hot); opacity:0; pointer-events:none; }
  .flash.on{ animation:flashpulse .16s steps(1) 3; }
  @keyframes flashpulse{ 0%{opacity:.5} 50%{opacity:0} 100%{opacity:.5} }
  /* B — konami max-disco strobe (no confetti) */
  .strobe{ position:absolute; inset:0; z-index:5; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  .strobe.on{ animation:strobe .11s steps(1) infinite; }
  @keyframes strobe{ 0%{background:#fff;opacity:.85} 25%{background:var(--party);opacity:.7} 50%{background:#000;opacity:.25} 75%{background:var(--teal);opacity:.7} 100%{background:var(--orange);opacity:.8} }
  /* Combo 1 — white strobe rave */
  .strobe.white{ animation:wstrobe .09s steps(1) infinite; }
  @keyframes wstrobe{ 0%{background:#fff;opacity:.92} 50%{background:#000;opacity:.12} 100%{background:#fff;opacity:.92} }
  /* Combo 2 — expanding shockwave rings */
  .pulsering{ position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:4px solid var(--glow); z-index:7; pointer-events:none; box-shadow:0 0 16px var(--glow); animation:pulsering 1s ease-out forwards; }
  @keyframes pulsering{ 0%{ transform:scale(.2); opacity:.9 } 100%{ transform:scale(9); opacity:0 } }
  /* Combo 4 — police siren red/blue flood */
  .siren{ position:absolute; inset:0; z-index:5; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  .siren.on{ animation:sirenflood .5s steps(1) infinite; }
  @keyframes sirenflood{ 0%{ background:radial-gradient(circle at 22% 50%, rgba(255,40,40,.75), transparent 55%); opacity:1 } 50%{ background:radial-gradient(circle at 78% 50%, rgba(50,90,255,.75), transparent 55%); opacity:1 } 100%{ background:radial-gradient(circle at 22% 50%, rgba(255,40,40,.75), transparent 55%); opacity:1 } }
  /* Combo 6 — 8-bit victory colour flash */
  .strobe.chip{ animation:chipflash .16s steps(1) infinite; }
  @keyframes chipflash{ 0%{background:#ffde3a;opacity:.72} 33%{background:#3fe6cc;opacity:.72} 66%{background:#ff6b1a;opacity:.72} 100%{background:#c94fd6;opacity:.72} }
  /* Combo 7 — bass-drop panel throb */
  .panel.throb{ animation:throb .5s ease-in-out 4; }
  @keyframes throb{ 0%,100%{ transform:scale(1); box-shadow:inset 0 0 46px rgba(0,0,0,.6) } 50%{ transform:scale(1.035); box-shadow:inset 0 0 60px rgba(255,60,20,.4),0 0 30px rgba(255,80,30,.5) } }
  /* Combo 8 — power-up gold glow flash */
  .panel.flashup{ animation:flashup .5s ease; }
  @keyframes flashup{ 0%,100%{ box-shadow:inset 0 0 46px rgba(0,0,0,.6) } 50%{ box-shadow:inset 0 0 40px rgba(255,220,120,.5),0 0 28px rgba(255,210,90,.75) } }
  /* Combo 9 — power-down brief dim */
  .panel.dim{ animation:pdim .85s ease; }
  @keyframes pdim{ 0%,100%{ filter:none } 45%{ filter:brightness(.5) saturate(.6) } }
  /* C — knob rev spin */
  .knob{ cursor:pointer; }
  .knob.rev{ animation:knobspin .6s cubic-bezier(.2,.8,.3,1); }
  @keyframes knobspin{ to{ transform:rotate(540deg) } }
  /* D — screws unscrew, fall, engine-room finale */
  .screw{ cursor:pointer; touch-action:none; transition:transform .25s,opacity .25s; }
  .screw.tick{ animation:screwtick 1.5s; }
  @keyframes screwtick{
    0%{ transform:rotate(0); animation-timing-function:cubic-bezier(.15,.85,.25,1) }   /* snap fast to 180° */
    16%{ transform:rotate(180deg); animation-timing-function:ease-out }                /* then unwind slowly back */
    100%{ transform:rotate(0) }
  }
  .screw.loosening{ animation:unscrew 1.5s linear forwards; }
  @keyframes unscrew{ 0%{transform:rotate(0) scale(1)} 100%{transform:rotate(540deg) scale(.9)} }
  /* Empty screw hole left behind after a screw falls out */
  .screw.hole{ background:radial-gradient(circle at 50% 42%, #000 0%, #0b0806 72%, #241a10 100%); border-color:#0a0705;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.95), inset 0 -1px 2px rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.5); }
  .screw.hole::before, .screw.hole::after{ display:none; }
  /* Fallen screw = a fixed-position clone appended to <body> → escapes the panel clip, drops out the window */
  /* Screws fall toward the MACHINE's bottom: down in landscape, left in portrait (machine rotated 90°) */
  .screwfly{ position:fixed; width:40px; height:40px; z-index:9999; pointer-events:none; }
  .screwfly.down{ animation:flydown 1.5s cubic-bezier(.4,.15,.7,1) forwards; }
  .screwfly.left{ animation:flyleft 1.5s cubic-bezier(.4,.15,.7,1) forwards; }
  @keyframes flydown{ 0%{ transform:translateY(0) rotate(0) } 100%{ transform:translateY(120vh) rotate(1100deg); opacity:.85 } }
  @keyframes flyleft{ 0%{ transform:translate(0,0) rotate(0) } 100%{ transform:translate(-120vw,0) rotate(1100deg); opacity:.85 } }
  /* D finale — panel comes loose and swings by its top-left corner, then snaps back */
  .panel.hang{ transform-origin:26px 26px; animation:hang 3.2s cubic-bezier(.3,.7,.4,1), disco 1.1s linear infinite; }
  @keyframes hang{
    0%{transform:none}
    12%{transform:translateY(20px) rotate(8deg)}
    30%{transform:translateY(15px) rotate(-6deg)}
    48%{transform:translateY(17px) rotate(5deg)}
    66%{transform:translateY(14px) rotate(-3deg)}
    82%{transform:translateY(8px) rotate(1.5deg)}
    100%{transform:none}   /* screws fly back → snaps straight */
  }
  .plaque{ position:absolute; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(24px,7vw,50px); font-weight:900; letter-spacing:.12em; color:var(--hot); background:rgba(10,7,4,.82);
    opacity:0; pointer-events:none; transition:opacity .3s; text-shadow:0 0 30px var(--glow); }
  .plaque.show{ opacity:1; }
  /* Hidden FDF'erfest ad (long-press red button) — slides down, machine-styled, non-blocking */
  /* Top banner. Opaque, lighter-than-panel background so it reads as a raised banner (not just an orange ring). */
  .ad{ position:absolute; left:8px; right:8px; top:8px; z-index:8; display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(180deg,#3a2b1c,#241a10); border:2px solid var(--orange); border-radius:10px;
    padding:10px 14px; box-shadow:0 10px 26px rgba(0,0,0,.7),0 0 22px rgba(255,107,26,.55);
    transform:translateY(-180%); pointer-events:none; transition:transform .42s cubic-bezier(.3,1.25,.5,1); }
  .ad.show{ transform:translateY(0); pointer-events:auto; }
  .adtxt{ color:var(--plate); font-size:clamp(11px,2.5vw,15px); letter-spacing:.02em; }
  .adtxt b{ color:var(--hot); }
  .adbtn{ flex:none; color:#fff; text-decoration:none; font-weight:800; font-size:clamp(11px,2.5vw,14px); letter-spacing:.08em; white-space:nowrap;
    background:radial-gradient(circle at 40% 30%,var(--hot),var(--orange) 60%,var(--orange-deep)); padding:6px 13px; border-radius:6px; box-shadow:0 0 10px rgba(255,107,26,.6); }
  .adclose{ flex:none; color:var(--sub); font-size:14px; cursor:pointer; padding:0 2px; }
  /* Easter egg — blank-cell tap: propeller flies across the whole screen, spinning. */
  .propfly{ position:absolute; top:38%; left:-320px; z-index:60; width:min(260px,45vmin); pointer-events:none; animation:propcross 2.2s linear forwards; }
  .propfly img{ display:block; width:100%; filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)); animation:propspin 0.85s linear infinite; }
  @keyframes propcross{ from{ left:-320px; } to{ left:calc(100% + 400px); } }
  @keyframes propspin{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
  /* MASKINEN final — rotating disco spotlights sweeping across the machine */
  .beams{ position:absolute; inset:-40%; z-index:4; pointer-events:none; opacity:0; mix-blend-mode:screen; transition:opacity .3s;
    background:conic-gradient(from 0deg,
      transparent 0 14deg, rgba(255,146,46,.55) 14deg 22deg, transparent 22deg 60deg,
      rgba(201,79,214,.5) 60deg 68deg, transparent 68deg 108deg,
      rgba(63,214,192,.45) 108deg 116deg, transparent 116deg 168deg,
      rgba(255,107,26,.55) 168deg 176deg, transparent 176deg 240deg,
      rgba(255,178,87,.5) 240deg 248deg, transparent 248deg 300deg,
      rgba(201,79,214,.45) 300deg 308deg, transparent 308deg 360deg); }
  .beams.on{ opacity:1; animation:beamspin 3.4s linear infinite; }
  @keyframes beamspin{ to{ transform:rotate(360deg); } }
  /* MASKINEN final — big text across the machine (transparent → machine dances behind) */
  .bigtext{ position:absolute; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 5%;
    font-size:clamp(28px,10vw,78px); font-weight:900; letter-spacing:.04em; line-height:1.02; color:#fff;
    text-shadow:0 0 34px var(--glow),0 0 12px var(--orange),0 3px 0 rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transform:scale(.7) rotate(-5deg); transition:opacity .3s,transform .3s; }
  .bigtext.show{ opacity:1; animation:bigwob 1.5s ease-in-out infinite .3s; }
  @keyframes bigwob{ 0%,100%{transform:scale(1) rotate(-5deg)} 50%{transform:scale(1.05) rotate(-2.5deg)} }
  /* dancing plate */
  .grid.dance .cell.num{ animation:platedance .5s ease-in-out infinite; }
  @keyframes platedance{ 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-7px) scale(1.06)} }
  .grid.dance .cell.num:nth-child(3n){ animation-delay:.08s } .grid.dance .cell.num:nth-child(3n+2){ animation-delay:.16s }
  /* Serial tap → "ÆGTE VARE" stamp */
  .serial{ cursor:pointer; }
  .serial.stamp{ animation:stamp .42s ease; color:#46d97a; text-shadow:0 0 10px #46d97a; }
  @keyframes stamp{ 0%{transform:scale(.5) rotate(-8deg);opacity:.3} 60%{transform:scale(1.25) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }
  /* E — ember sparks when 90 lights up */
  .ember{ position:absolute; width:6px; height:6px; border-radius:50%; pointer-events:none; z-index:7;
    background:radial-gradient(circle,#fff 0%,#ffb257 40%,#e0490f 85%); box-shadow:0 0 8px #ff922e;
    animation:ember .9s ease-out forwards; }
  @keyframes ember{ to{ transform:translate(var(--dx),var(--dy)) scale(.15); opacity:0; } }

  /* ==========================================================================
     VARIANT A — RISOGRAPH GIG POSTER
     The machine metaphor is gone: no bezel, no panel, no frame, no glow, no
     bevels. This is a screenprinted poster — flat spot inks on warm paper,
     visible grain and halftone, oversized Archivo Black display type, and a
     deliberate pink misregistration offset under every lit number.
     Palette is the extracted Seniorfestival system, nothing else.
     Deliberately shares nothing with variant D (pixels) or variant C (bloom).
     ========================================================================== */
  body{
    --ink:#111018; --paper:#efe7e2; --paper-2:#d9d3cf;
    --orange:#ff6a00; --pink:#ff2d72; --sand:#ffb25f; --cyan:#00b5e2;
    --display:"Archivo Black",Impact,sans-serif;
    --meta:"Archivo",system-ui,sans-serif;
    /* legacy machine tokens re-pointed so unconverted rules stay in palette */
    --orange-deep:#ff2d72; --glow:#ff6a00; --hot:#ffb257;
    --teal:#00b5e2; --party:#ff2d72; --party2:#00b5e2;
    --bg:#efe7e2; --panel:transparent; --plate:#efe7e2; --plate-blank:#d9d3cf;
    --bezel1:#efe7e2; --bezel2:#d9d3cf; --glowbg:#efe7e2;
    --sub:rgba(17,16,24,.55); --btnglow:#ff6a00;
    font-family:var(--meta); color:var(--ink);
  }
  html,body{ background:var(--paper); }

  /* Paper ground + halftone field. Flat inks only — no radial glows anywhere. */
  .stage{ background:
      radial-gradient(rgba(255,106,0,.20) 1.1px,transparent 1.2px) 0 0/9px 9px,
      radial-gradient(rgba(255,45,114,.13) 1.1px,transparent 1.2px) 4px 4px/9px 9px,
      var(--paper); }
  /* 4 — roller streaks: faint bands of thinner ink, fixed to the sheet. */
  .stage::before{ content:""; position:absolute; inset:0; z-index:29; pointer-events:none;
    mix-blend-mode:multiply; opacity:.5;
    background:repeating-linear-gradient(90deg,
      transparent 0 17%, rgba(255,255,255,.55) 17% 19%, transparent 19% 46%,
      rgba(255,255,255,.4) 46% 47.2%, transparent 47.2% 78%,
      rgba(255,255,255,.5) 78% 80%, transparent 80% 100%); }

  /* Press grain — the texture that sells the print. */
  .stage::after{ content:""; position:absolute; inset:0; z-index:30; pointer-events:none;
    opacity:.5; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.42'/></svg>"); }

  /* No cabinet. The sheet IS the layout. */
  /* No cabinet and no clip. html/body already hide scrollbars, so ink is free
     to bleed past the old machine box and off the sheet — the way a poster
     trims. The box only survives as a centring device for the plate. */
  .stage{ overflow:visible; }
  .bezel{ background:none; box-shadow:none; padding:0; border-radius:0;
    max-width:1000px; overflow:visible; }
  .panel{ background:none; border:0; border-radius:0; box-shadow:none;
    padding:0 6px 4px; overflow:visible; }
  /* Grid-breaking watermark, printed under everything in pale sand ink. */
  /* Watermark: centred on the sheet and scaled off the long viewport axis so
     it fills the width the machine actually has, in either orientation. */
  .panel::before{ content:"BANKO"; position:absolute; inset:0; z-index:4;
    pointer-events:none; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-size:27vmax; line-height:.78;
    letter-spacing:-.065em; color:var(--sand); opacity:.26; mix-blend-mode:multiply;
    transform:rotate(-4deg); white-space:nowrap;
    text-shadow:var(--wx,10px) var(--wy,-6px) 0 var(--wc,var(--cyan)); }
  .rail, .batwrap, .grid, .statusbar{ position:relative; z-index:1; }

  /* Screws → printed register marks (the crosshairs on a press sheet). */
  .screw, .stage .screw{ width:14px; height:14px; border-radius:50%; background:none;
    border:2px solid var(--ink); box-shadow:none; opacity:.5; }
  .screw::before, .screw::after{ display:block; content:""; position:absolute;
    background:var(--ink); left:50%; top:50%; }
  .screw::before{ width:2px; height:22px; transform:translate(-50%,-50%); }
  .screw::after{ width:22px; height:2px; transform:translate(-50%,-50%); }
  .screw.hole{ opacity:.18; }
  .s1{top:0;left:0}.s2{top:0;right:0}.s3{bottom:0;left:0}.s4{bottom:0;right:0}
  .stage .s1{top:0;left:0}.stage .s2{top:0;right:0}
  .stage .s3{bottom:0;left:0}.stage .s4{bottom:0;right:0}

  /* Masthead — oversized, tilted, ink on paper. */
  /* ---- Sheet composition (mobile-first) --------------------------------
     The header band was a control strip: counter, chips and serial in one
     row. Broken apart — the counter is a big overprinted numeral in the top
     corner, the serial runs up the left trim like a print code, the chips
     are an ink-swatch column on the right trim, and the status line stays
     along the bottom. Nothing sits in a row with anything else.
     The wrappers become display:contents so each mark is placed against the
     sheet directly; every element stays in the DOM and stays clickable.
     Sizes use vmin so they hold in the rotated portrait machine too. ---- */
  .lgroup, .rgroup{ display:contents; }
  /* static, so the trim marks below resolve against the sheet (.panel),
     not against this now-tiny masthead band */
  .rail{ position:static; display:block; padding:0; margin:0 0 6px; }
  .nameplate{ position:static; transform:none; text-align:left;
    max-width:none; padding:0 0 0 2px; }
  .title{ font-family:var(--display); font-weight:400; color:var(--ink);
    letter-spacing:-.055em; text-indent:0; line-height:.8;
    font-size:clamp(28px,6.6vmax,84px);
    text-shadow:var(--mx,4px) var(--my,4px) 0 var(--mc,var(--orange));
    transform:rotate(-2deg); transform-origin:left bottom; display:inline-block; }
  .stage .title{ font-family:var(--display); letter-spacing:-.055em; text-indent:0;
    font-size:clamp(28px,6.6vmax,84px); line-height:.8; }
  /* 6 — the subtitle leaves the masthead and runs up the right trim, which
     frees the whole top band for the display type alone. */
  /* writing-mode reads bottom-to-top without transform-origin guesswork, and
     centres cleanly on the trim at any height. */
  .sub{ position:absolute; right:0; top:50%; z-index:3; margin:0;
    writing-mode:vertical-rl; transform:translateY(-50%) rotate(180deg);
    transform-origin:center; white-space:nowrap;
    font-family:var(--meta); font-weight:700; color:var(--ink); opacity:.6;
    text-transform:uppercase; letter-spacing:.22em; text-indent:.22em;
    font-size:clamp(6px,.95vmax,10px); line-height:1; }
  .stage .sub{ font-size:clamp(6px,.95vmax,10px); letter-spacing:.22em; text-indent:.22em; }

  /* The endorsement line under the masthead. Set in the meta face rather than
     the display one — at 31 characters the display face would either dwarf
     BANKO or have to shrink to nothing. */
  .nameplate::after{ content:"ANBEFALET AF RØGVENDERRAPPORTEN"; display:block;
    margin-top:7px; font-family:var(--meta); font-weight:700; color:var(--ink);
    text-transform:uppercase; letter-spacing:.19em; opacity:.75;
    font-size:clamp(6px,1.15vmax,12px); line-height:1.3; white-space:nowrap;
    text-shadow:var(--mx,2px) var(--my,2px) 0 var(--mc,var(--cyan)); }

  /* Room on the trims for the marks that now live there. */
  .panel{ padding:2px 30px 2px 22px; }

  /* Counter → a big number overprinted into the top corner. Not a readout. */
  .crt{ position:absolute; top:-2px; right:26px; z-index:3;
    width:auto; height:auto; background:none; border:0; border-radius:0;
    box-shadow:none; overflow:visible; }
  .crt-grid, .scan{ display:none; }
  /* 9 — set as a stacked fraction with a rule between, not "04/15". */
  .crt-num{ position:static; display:block; text-align:center;
    font-family:var(--display); font-weight:400; color:var(--orange);
    mix-blend-mode:multiply; font-size:clamp(28px,6.2vmax,82px);
    line-height:.8; letter-spacing:-.06em;
    text-shadow:var(--mx,3px) var(--my,3px) 0 var(--mc,var(--cyan)); }
  .crt-num span{ display:block; color:var(--ink); opacity:.5; font-size:.34em;
    border-top:2px solid currentColor; margin:2px auto 0; padding-top:2px; width:1.9em;
    letter-spacing:-.02em; }

  /* Serial → print code running up the left trim. */
  .serial{ position:absolute; left:4px; bottom:14%; z-index:3;
    transform:rotate(-90deg); transform-origin:left bottom; white-space:nowrap;
    font-family:var(--meta); font-weight:700; color:var(--ink); opacity:.5;
    font-size:clamp(7px,1.05vmax,11px); letter-spacing:.34em; text-shadow:none; }
  .stage .serial{ font-size:clamp(7px,1.05vmax,11px); }

  /* 1 — Chips are no longer knobs in a column: one flush ink-swatch strip
     down the right trim, the way a press sheet carries its colour bar. */
  .knobs{ position:absolute; left:0; top:26%; z-index:3;
    flex-direction:column; gap:0; }
  .fader{ position:absolute; left:0; top:26%; z-index:3; margin-top:63px; }
  .redbtn{ position:absolute; left:0; top:26%; z-index:3; margin-top:84px; }
  .knob, .tgl, .fader, .redbtn,
  .stage .knob, .stage .tgl, .stage .fader, .stage .redbtn{
    width:13px; height:21px; border:0; border-radius:0; box-shadow:none; }
  .knob, .tgl, .fader, .redbtn, .rivets i{
    box-shadow:var(--mx,2px) var(--my,2px) 0 var(--mc,var(--pink)); }
  .knob{ background:var(--cyan); } .knob.k3{ background:var(--ink); }
  .knob::after, .tgl.on::after, .fader::before, .fader::after{ display:none; }
  .tgl{ background:var(--pink); }
  .fader{ background:var(--sand); }
  .redbtn{ background:var(--orange); }

  /* Progress → an ink rule that fills. No gauge, no segments-as-cells. */
  .batwrap{ margin:0 4px 12px; }
  .battery{ background:none; border:0; border-bottom:2px solid var(--ink); border-radius:0;
    box-shadow:none; padding:0 0 4px; gap:4px; }
  .battery i{ background:rgba(17,16,24,.14); border-radius:0; box-shadow:none; height:8px; }
  .battery i.on.g, .battery i.on.a, .battery i.on.r{ background:var(--orange); box-shadow:none; }
  .nub{ display:none; }
  .full .battery{ border-bottom-color:var(--orange); box-shadow:none; }

  /* The plate — flat ink blocks, hard edges, paper gutters. */
  /* 3 — nothing on a press lands perfectly square, and the ink lays down
     unevenly across the sheet. */
  .grid{ background:none; border:0; border-radius:0; padding:0; gap:6px;
    transform:rotate(-1.1deg); }
  .cell.num:nth-child(9n+2), .cell.num:nth-child(9n+5){ background:#e4dcd4; }
  .cell.num:nth-child(9n+3), .cell.num:nth-child(9n+7){ background:#dcd4cb; }
  .cell.num:nth-child(9n+6){ background:#e9e1d9; }
  .cell{ border-radius:0; overflow:visible; }
  .cell.num{ background:var(--paper-2); color:var(--ink); box-shadow:none;
    font-family:var(--display); font-weight:400; letter-spacing:-.04em;
    transition:background .08s,color .08s; }
  /* 8 — marking is stamping: the tile takes the hit and leaves an ink ring. */
  .cell.num{ transition:background .08s,color .08s,transform .06s,box-shadow .06s; }
  .cell.num:active{ transform:scale(.93); box-shadow:0 0 0 4px rgba(17,16,24,.16); }
  /* 5 — one tile is pasted on askew. */
  .cell.num.pasted{ transform:rotate(3deg) translate(0,-5px); z-index:2;
    box-shadow:4px 5px 0 rgba(17,16,24,.16); }
  .cell.num.pasted:active{ transform:rotate(3deg) translate(0,-5px) scale(.93); }
  /* 4 — blanks are a pale sand plate, so the sheet reads as three inks. */
  /* 2 — the sand plate drifts the other way; multi-plate drift is what makes
     a riso pull look hand-made rather than one shared offset. */
  /* Tiles stay on the grid. Only the ink plate under a lit tile drifts —
     moving the tiles themselves turned the plate into noise. */
  .cell.blank{ background:rgba(255,178,95,.20); opacity:1; box-shadow:none;
    mix-blend-mode:multiply; }
  /* 3 — on a two-colour pull the paper shows through the type. */
  .cell.num.lit{ background:var(--orange); color:var(--paper); text-shadow:none;
    box-shadow:none; animation:none; }
  /* Misregistration: a pink plate printed 5px off, multiplied under the orange. */
  /* 9 — screenprint ink spreads; a razor-sharp offset reads digital.
     --mx/--my/--mc are randomised per element in JS, so no two marks drift the
     same way and the offending ink is never the same one twice. */
  .cell.lit::after{ content:""; position:absolute; inset:0; z-index:-1;
    background:var(--mc,var(--pink)); mix-blend-mode:multiply;
    transform:translate(var(--mx,5px),var(--my,5px)); filter:blur(1.2px); }

  /* 6 — a hairline trim rectangle turns the screen into a cut sheet; the
     register crosshairs at the corners already read as crop marks. */
  .bezel::before{ content:""; position:absolute; inset:16px; z-index:5;
    pointer-events:none; border:1px solid rgba(17,16,24,.28); }

  /* 7 — the status line is a printer's colophon, not a machine readout. */
  .statusbar{ padding:0 14px; }
  .readout{ font-size:8px; letter-spacing:.17em; }
  .readout::after{ content:" · TRYKT I NR. SNEDE"; opacity:.55; }
  .pwr{ width:11px; height:11px; border-radius:50%; background:var(--pink);
    box-shadow:none; animation:none; }
  .readout{ font-family:var(--meta); font-weight:700; color:var(--ink); opacity:.6;
    text-transform:uppercase; letter-spacing:.2em; font-size:9px; }
  .rivets i{ border-radius:0; width:9px; height:9px; background:var(--cyan);
    border:1px solid var(--ink); box-shadow:none; }
  .rivets i:nth-child(2){ background:var(--pink) } .rivets i:nth-child(3){ background:var(--orange) }
  .rivets i:nth-child(4){ background:var(--sand) } .rivets i:nth-child(5){ background:var(--ink) }
  .rivets i:nth-child(6){ background:var(--paper-2) }

  /* Win — the poster is overprinted edge to edge. */
  /* 8 — the poster flips: full orange flood, type knocked out to paper,
     pink plate printed 8px off. */
  .win{ background:var(--orange); }
  .win .type{ font-family:var(--display); font-weight:400; color:var(--paper);
    font-size:clamp(38px,13vw,150px); letter-spacing:-.06em; line-height:.82;
    text-shadow:var(--mx,8px) var(--my,8px) 0 var(--mc,var(--pink)); }
  .win .banko{ font-family:var(--meta); font-weight:700; color:var(--ink); opacity:.8;
    text-transform:uppercase; letter-spacing:.3em; font-size:clamp(9px,1.6vw,14px); }
  .ret .lbl{ font-family:var(--meta); font-weight:700; color:var(--ink); opacity:.75;
    text-transform:uppercase; letter-spacing:.2em; font-size:10px; }
  .ret .track{ background:none; border:0; border-bottom:3px solid rgba(17,16,24,.28);
    border-radius:0; box-shadow:none; height:3px; }
  .ret .bar{ background:var(--ink); height:3px; }

  /* Overlays & eggs — printed, never glowing. */
  .secret, .plaque, .bigtext{ font-family:var(--display); font-weight:400; letter-spacing:-.03em; }
  .secret{ color:var(--ink); text-shadow:3px 3px 0 var(--sand); }
  .plaque{ background:var(--paper); color:var(--ink); text-shadow:5px 5px 0 var(--orange); }
  .bigtext{ color:var(--ink); text-shadow:6px 6px 0 var(--orange), 12px 12px 0 var(--pink); }
  .aura::before{ background:radial-gradient(circle at 50% 47%,rgba(255,178,95,.30),transparent 62%);
    mix-blend-mode:multiply; }
  .aura::after{ display:none; }
  .ember{ border-radius:50%; background:var(--pink); box-shadow:none; }
  .pulsering{ border-radius:50%; border:5px solid var(--ink); box-shadow:none; }
  .ad{ background:var(--ink); border:0; border-radius:0; box-shadow:8px 8px 0 var(--orange); }
  .adtxt{ color:var(--paper); font-family:var(--meta); }
  .adtxt b{ color:var(--sand); }
  .adbtn{ font-family:var(--meta); font-weight:700; background:var(--orange); color:var(--ink);
    border-radius:0; box-shadow:none; letter-spacing:.1em; text-transform:uppercase; }
  .adclose{ color:var(--paper); opacity:.6; }
  .dbg button{ font-family:var(--meta); font-weight:700; background:var(--ink); color:var(--paper);
    border:0; border-radius:0; text-transform:uppercase; letter-spacing:.1em; }
  .dbg .info{ color:var(--ink); opacity:.6; }
  @keyframes chipflash{ 0%{background:var(--sand);opacity:.6} 33%{background:var(--cyan);opacity:.6}
    66%{background:var(--orange);opacity:.6} 100%{background:var(--pink);opacity:.6} }
  @keyframes strobe{ 0%{background:var(--paper);opacity:.85} 25%{background:var(--pink);opacity:.6}
    50%{background:var(--ink);opacity:.2} 75%{background:var(--cyan);opacity:.6}
    100%{background:var(--orange);opacity:.7} }
  .beams{ background:conic-gradient(from 0deg,
      transparent 0 16deg, rgba(255,106,0,.40) 16deg 24deg, transparent 24deg 76deg,
      rgba(255,45,114,.36) 76deg 84deg, transparent 84deg 136deg,
      rgba(0,181,226,.32) 136deg 144deg, transparent 144deg 196deg,
      rgba(255,178,95,.40) 196deg 204deg, transparent 204deg 360deg);
    mix-blend-mode:multiply; }

  @media (prefers-reduced-motion:reduce){
    .beams.on{ animation:none !important; }
  }

  /* --- Easter egg K — stempelbordet ------------------------------------
     Hold a finger on bare paper and a rubber stamp slams down there. They
     accumulate, so the sheet fills with press marks; the eighth one calls a
     re-pull and the whole lot lifts at once. Stamps never take pointer
     events, so marking numbers is never blocked. --------------------- */
  /* a long press on iOS otherwise raises the selection callout and eats the
     gesture before the timer fires */
  .panel{ -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .stamp{ position:absolute; z-index:6; pointer-events:none;
    font-family:var(--display); font-weight:400; letter-spacing:-.02em;
    font-size:clamp(13px,2.4vmax,30px); line-height:1; white-space:nowrap;
    padding:.28em .42em; border:.16em solid currentColor; border-radius:2px;
    mix-blend-mode:multiply; opacity:0;
    transform:translate(-50%,-50%) rotate(var(--rot)) scale(2.6);
    animation:stampslam .34s cubic-bezier(.2,1.5,.35,1) forwards; }
  .stamp.ink1{ color:var(--pink); } .stamp.ink2{ color:var(--orange); }
  .stamp.ink3{ color:var(--ink); }
  /* rare pull: a metallic stamp that catches the light */
  .stamp.foil{ color:var(--sand);
    background:linear-gradient(105deg,rgba(255,178,95,.30),rgba(255,106,0,.16) 40%,
      rgba(255,255,255,.55) 50%,rgba(255,106,0,.16) 60%,rgba(255,178,95,.30));
    background-size:260% 100%; animation:stampslam .34s cubic-bezier(.2,1.5,.35,1) forwards,
      foilsheen 2.6s linear infinite .34s; }
  @keyframes foilsheen{ from{ background-position:120% 0 } to{ background-position:-120% 0 } }
  /* ink that soaked into the paper — stays after the sheet is re-pulled */
  .stamp.soaked{ opacity:.26 !important; }
  /* the smeared duplicate underneath = ink pushed out at the edge */
  .stamp::before{ content:attr(data-t); position:absolute; left:-.42em; top:-.28em;
    padding:.28em .42em; border:.16em solid currentColor; border-radius:2px;
    filter:blur(1.6px); opacity:.5; transform:translate(2px,2px); }
  @keyframes stampslam{
    0%  { opacity:0;   transform:translate(-50%,-50%) rotate(var(--rot)) scale(2.6) }
    62% { opacity:.86; transform:translate(-50%,-50%) rotate(var(--rot)) scale(.94) }
    100%{ opacity:.78; transform:translate(-50%,-50%) rotate(var(--rot)) scale(1) }
  }
  .stamp.lift{ animation:stamplift .5s ease forwards; }
  @keyframes stamplift{ to{ opacity:0; transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.5) } }
  /* the re-pull: one full-bleed mark across the whole sheet */
  .repull{ position:absolute; inset:0; z-index:7; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:400; color:var(--pink);
    font-size:clamp(30px,9vmax,120px); letter-spacing:-.05em;
    mix-blend-mode:multiply; opacity:0; transform:rotate(-7deg) scale(2.2);
    animation:stampslam .42s cubic-bezier(.2,1.5,.35,1) forwards; --rot:-7deg; }

  /* --- Easter egg L — crop-mark alignment ------------------------------
     The register crosshairs are the four screws. Hit all four inside 3s and
     the sheet pulls square; it will not stay there. --------------------- */
  .grid{ transition:transform .55s cubic-bezier(.2,1.2,.3,1); }
  .grid.aligned{ transform:rotate(0deg); }

  /* --- Easter egg M — colour-bar calibration ---------------------------
     Tap the left-trim swatches top to bottom and the press runs each ink
     across the whole sheet in turn. ------------------------------------- */
  .inkflood{ position:absolute; inset:0; z-index:7; pointer-events:none;
    mix-blend-mode:multiply; opacity:.7; }
</style>
</head>
<body>

<canvas class="confetti" id="confetti"></canvas>
<script>
(function(){
  "use strict";

  // ---------- Randomness: crypto only (ADR-6). Never Date.now / raw Math.random. ----------
  // ponytail: modulo bias on a 32-bit draw is ~1e-9 for n<=90 — irrelevant for banko.
  function rnd(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  // ---------- Plate generation (classic Danish banko, 3×9). ----------
  function colRange(c){                 // inclusive [lo,hi]
    if(c===0) return [1,9];
    if(c===8) return [80,90];           // 80–90 = 11 numbers (off-by-one trap)
    return [c*10, c*10+9];
  }
  function drawUnique(lo,hi,k){         // k distinct numbers from [lo,hi], sorted asc
    const pool=[]; for(let v=lo; v<=hi; v++) pool.push(v);
    shuffle(pool);
    return pool.slice(0,k).sort((a,b)=>a-b);
  }
  function pickRows(cnt){               // subset of {0,1,2} of size cnt, sorted
    return shuffle([0,1,2]).slice(0,cnt).sort((a,b)=>a-b);
  }
  function colCounts(){                 // 9 columns, each 1–3, total 15
    const c=Array(9).fill(1); let extra=6;
    while(extra>0){ const i=rnd(9); if(c[i]<3){ c[i]++; extra--; } }
    return c;
  }
  function rowLayout(counts){           // rejection-sample until every row has exactly 5 (PLAN §3)
    for(let attempt=0; attempt<2000; attempt++){
      const rowsOfCol = counts.map(pickRows);
      const tot=[0,0,0];
      rowsOfCol.forEach(rs=>rs.forEach(r=>tot[r]++));
      if(tot[0]===5 && tot[1]===5 && tot[2]===5) return rowsOfCol;
    }
    throw new Error("rowLayout failed");
  }
  function makePlate(){                 // → 3×9 grid of number|null (explicit blanks, PLAN §3.5)
    const counts=colCounts();
    const rowsOfCol=rowLayout(counts);
    const grid=[[],[],[]].map(()=>Array(9).fill(null));
    for(let c=0;c<9;c++){
      const [lo,hi]=colRange(c);
      const nums=drawUnique(lo,hi,counts[c]);      // sorted asc
      const rows=rowsOfCol[c];                      // sorted asc → smallest on top
      rows.forEach((r,i)=> grid[r][c]=nums[i]);
    }
    return grid;
  }

  // ---------- Serial = FNV-1a hash of the 15 numbers (ADR-11). Deterministic, local. ----------
  function plateNums(grid){ const out=[]; for(const row of grid) for(const v of row) if(v!=null) out.push(v); return out; }
  function serialOf(grid){
    let h=0x811c9dc5>>>0;
    for(const n of plateNums(grid)){ h^=n; h=Math.imul(h,0x01000193)>>>0; }
    return "MSKN-"+h.toString(16).toUpperCase().padStart(8,"0").slice(-4);
  }

  // ---------- Self-check (?test): 5000 plates, log rule breaks (DoD). ----------
  function validate(grid){
    const errs=[];
    const nums=plateNums(grid);
    if(nums.length!==15) errs.push("total "+nums.length);
    if(new Set(nums).size!==nums.length) errs.push("dup numbers");
    for(let r=0;r<3;r++){ const c=grid[r].filter(v=>v!=null).length; if(c!==5) errs.push("row "+r+" has "+c); }
    for(let c=0;c<9;c++){
      const col=[grid[0][c],grid[1][c],grid[2][c]].filter(v=>v!=null);
      if(col.length<1||col.length>3) errs.push("col "+c+" has "+col.length);
      const [lo,hi]=colRange(c);
      for(const v of col){ if(v<lo||v>hi) errs.push("col "+c+" value "+v+" out of ["+lo+","+hi+"]"); }
      for(let i=1;i<col.length;i++){ if(col[i]<=col[i-1]) errs.push("col "+c+" not sorted"); }
    }
    return errs;
  }
  function selfCheck(){
    const N=5000; let breaks=0;
    for(let i=0;i<N;i++){ const e=validate(makePlate()); if(e.length){ breaks++; if(breaks<=5) console.error("plate",i,e); } }
    console.log("[?test] "+N+" plader, "+breaks+" regelbrud"+(breaks===0?" ✓":" ✗"));
    document.body.innerHTML='<pre style="color:'+(breaks?'#ff4d3d':'#46d97a')+';font:16px monospace;padding:20px">'
      +N+' plader — '+breaks+' regelbrud'+(breaks===0?' ✓ (se konsol)':' ✗ (se konsol)')+'</pre>';
  }

  // ---------- Persistence (localStorage, ADR-3). Plate pinned on first open (ADR-4). ----------
  const K_GRID="banko.grid", K_MARKS="banko.marks";
  function loadGrid(){
    try{ const s=localStorage.getItem(K_GRID); if(s){ const g=JSON.parse(s); if(validate(g).length===0) return g; } }catch(e){}
    return null;
  }
  function saveGrid(g){ try{ localStorage.setItem(K_GRID, JSON.stringify(g)); }catch(e){} }
  function loadMarks(){ try{ return new Set(JSON.parse(localStorage.getItem(K_MARKS)||"[]")); }catch(e){ return new Set(); } }
  function saveMarks(set){ try{ localStorage.setItem(K_MARKS, JSON.stringify([...set])); }catch(e){} }

  // ================= app =================
  const params=new URLSearchParams(location.search);
  if(params.has("test")){ selfCheck(); return; }

  const $=s=>document.querySelector(s);
  const panel=$("#panel"), gridEl=$("#grid"), crt=$("#crt"), serialEl=$("#serial"), bat=[...document.querySelectorAll("#bat i")];
  const title=$("#title"), secret=$("#secret"), win=$("#win"), winType=$("#wintype"), retbar=$("#retbar");

  let grid=loadGrid();
  if(!grid){ grid=makePlate(); saveGrid(grid); localStorage.removeItem(K_MARKS); }
  let marks=loadMarks();
  let prevCompleteRows=0, partyActive=false;

  function litCount(){ return plateNums(grid).filter(v=>marks.has(v)).length; }
  function completeRows(){
    let n=0;
    for(let r=0;r<3;r++){ const nums=grid[r].filter(v=>v!=null); if(nums.every(v=>marks.has(v))) n++; }
    return n;
  }
  // ---- Misregistration. Every coloured mark gets its own drift and its own
  // offending ink, re-rolled on each render, so the "printing error" never
  // repeats in the same direction or the same colour order twice.
  const MIS_INKS=["#ff2d72","#ff6a00","#00b5e2","#ffb25f","#111018"];
  // multiplied under an orange plate, the ink-black option turns a tile olive,
  // which reads as a broken tile rather than a misprint — tiles get the
  // coloured inks only.
  const MIS_INKS_TILE=["#ff2d72","#ff6a00","#00b5e2","#ffb25f"];
  function misreg(el,max,minAbs,inks){
    if(!el) return;
    inks=inks||MIS_INKS;
    max=max||6; minAbs=minAbs===undefined?2:minAbs;
    const off=()=>{ let v=(Math.random()*2-1)*max;
      if(Math.abs(v)<minAbs) v=v<0?-minAbs:minAbs; return v.toFixed(1)+"px"; };
    el.style.setProperty("--mx",off());
    el.style.setProperty("--my",off());
    el.style.setProperty("--mc",inks[Math.floor(Math.random()*inks.length)]);
  }
  function misregSheet(){
    misreg(document.querySelector(".title"),7,3);
    misreg(document.querySelector(".nameplate"),4,2);
    misreg(document.querySelector(".crt-num"),5,2);
    misreg(document.querySelector(".win .type"),12,5);
    document.querySelectorAll(".knob,.tgl,.fader,.redbtn,.rivets i")
            .forEach(el=>misreg(el,4,2));
    // the watermark uses its own props so it can drift much further
    const pn=document.querySelector(".panel");
    if(pn){
      const big=()=>((Math.random()*2-1)*22).toFixed(1)+"px";
      pn.style.setProperty("--wx",big()); pn.style.setProperty("--wy",big());
      // ink-black behind a 46vh word is a bruise, not a misprint
      pn.style.setProperty("--wc",MIS_INKS_TILE[Math.floor(Math.random()*MIS_INKS_TILE.length)]);
    }
  }

  function refreshReadouts(){
    const lit=litCount();
    crt.innerHTML=String(lit).padStart(2,"0")+"<span>15</span>";   // set as a fraction in CSS
    bat.forEach((s,i)=>{ s.className=""; if(i<lit) s.classList.add("on", i<5?"g":i<10?"a":"r"); });
    document.querySelector(".batwrap").classList.toggle("full", lit>=15);
  }

  function render(){
    serialEl.textContent=serialOf(grid);
    gridEl.innerHTML="";
    for(let r=0;r<3;r++) for(let c=0;c<9;c++){
      const v=grid[r][c];
      const cell=document.createElement("div");
      if(v==null){ cell.className="cell blank"; cell.addEventListener("click",flyPropeller); }
      else{
        cell.className="cell num"+(marks.has(v)?" lit":"");
        cell.textContent=v; cell.dataset.n=v;
        cell.addEventListener("click",()=>toggle(v,cell));
      }
      gridEl.appendChild(cell);
    }
    // One tile is pasted on askew, picked from the plate hash so it is stable
    // for this card but different between cards.
    const numCells=[...gridEl.querySelectorAll(".cell.num")];
    if(numCells.length){
      const h=parseInt(serialOf(grid).slice(-4),16)||0;
      numCells[h%numCells.length].classList.add("pasted");
    }
    gridEl.querySelectorAll(".cell").forEach(c=>misreg(c, c.classList.contains("blank")?4:7, 2, MIS_INKS_TILE));
    misregSheet();
    prevCompleteRows=completeRows();
    refreshReadouts();
  }

  function toggle(v,cell){
    if(partyActive) return;
    if(marks.has(v)) marks.delete(v); else marks.add(v);
    cell.classList.toggle("lit", marks.has(v));
    misreg(cell,7,2,MIS_INKS_TILE);      // fresh drift each time the plate is pulled
    saveMarks(marks);
    refreshReadouts();
    if(v===90 && marks.has(90)) emberBurst(cell);   // E — gnist ved 90
    const now=completeRows();
    if(now>prevCompleteRows && now>0) celebrate(now);
    prevCompleteRows=now;
  }

  // ---------- Party sequence (ADR-12): 20s. win-type + confetti + disco + techno + return bar. ----------
  const WIN_LABEL=[null,"1 RÆKKE","2 RÆKKER","FULD PLADE"];
  function celebrate(rows){
    partyActive=true;
    winType.textContent=WIN_LABEL[rows]||"BANKO!";
    win.classList.add("show"); panel.classList.add("party"); gridEl.classList.add("dance");
    startConfetti();
    playRave(9);                                   // starts on this tap = user gesture (mobile audio rule)
    retbar.className="bar"; void retbar.offsetWidth; retbar.classList.add("run"); // 100%→0 over 10s
    setTimeout(()=>{
      win.classList.remove("show"); panel.classList.remove("party"); gridEl.classList.remove("dance");
      stopConfetti();
      partyActive=false;
    },10000);
  }

  // Confetti — plain canvas, no lib.
  const cv=$("#confetti"), cx=cv.getContext("2d");
  let confetti=[], confAF=0;
  const CONF_COLORS=["#ff6a00","#ff2d72","#ffb25f","#00b5e2","#efe7e2"];
  function sizeConfetti(){
    const w=Math.round(cv.clientWidth||innerWidth), h=Math.round(cv.clientHeight||innerHeight);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  }
  addEventListener("resize",sizeConfetti);
  addEventListener("orientationchange",()=>setTimeout(sizeConfetti,60));
  function startConfetti(){
    sizeConfetti();
    confetti=[];
    for(let i=0;i<160;i++) confetti.push({
      x:rnd(cv.width), y:-rnd(cv.height), w:5+rnd(10), h:6+rnd(14),
      vy:2+rnd(4), vx:(rnd(200)-100)/34, rot:rnd(360), vr:(rnd(200)-100)/3,
      flip:rnd(360)/57, vf:(3+rnd(6))/120,
      col:CONF_COLORS[rnd(CONF_COLORS.length)]
    });
    cancelAnimationFrame(confAF); confAF=requestAnimationFrame(confStep);
  }
  function confStep(){
    cx.clearRect(0,0,cv.width,cv.height);
    for(const p of confetti){
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.flip+=p.vf;
      if(p.y>cv.height+20){ p.y=-20; p.x=rnd(cv.width); }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot*Math.PI/180);
      cx.scale(Math.cos(p.flip),1);            // edge-on when the cosine crosses zero
      cx.fillStyle=p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }
    confAF=requestAnimationFrame(confStep);
  }
  function stopConfetti(){ cancelAnimationFrame(confAF); cx.clearRect(0,0,cv.width,cv.height); }

  // One-shot confetti POP — bursts out from centre with gravity, fades, self-clears (~1.3s). No rain.
  function popConfetti(){
    sizeConfetti();
    const cxp=cv.width/2, cyp=cv.height*0.5, parts=[];
    for(let i=0;i<130;i++){ const a=Math.PI*2*rnd(360)/360, sp=4+rnd(10);
      parts.push({x:cxp+rnd(70)-35, y:cyp+rnd(40)-20, w:5+rnd(7), h:8+rnd(9),
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-4, rot:rnd(360), vr:(rnd(200)-100)/2.2,
        flip:rnd(360)/57, vf:(5+rnd(10))/120,
        col:CONF_COLORS[rnd(CONF_COLORS.length)], life:1 }); }
    let frame=0; cancelAnimationFrame(confAF);
    (function tick(){
      cx.clearRect(0,0,cv.width,cv.height);
      parts.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.rot+=p.vr; p.flip+=p.vf; p.life-=0.013;
        if(p.life>0){ cx.globalAlpha=Math.max(0,p.life); cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot*Math.PI/180); cx.scale(Math.cos(p.flip),1); cx.fillStyle=p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); } });
      cx.globalAlpha=1;
      if(++frame<82) confAF=requestAnimationFrame(tick); else cx.clearRect(0,0,cv.width,cv.height);
    })();
  }

  // Battery VU — segments flicker like an equalizer during the party, restored after.
  let vuTimer=null;
  function startVU(){ vuTimer=setInterval(()=>{ bat.forEach((s,i)=>{ s.className=""; if(rnd(2)) s.classList.add("on", i<5?"g":i<10?"a":"r"); }); },110); }
  function stopVU(){ clearInterval(vuTimer); vuTimer=null; refreshReadouts(); }

  // Techno stinger ~10s — four-on-floor kick + offbeat stab, Web Audio (ADR-12).
  function playTechno(secs){
    secs=secs||10;
    let ctx; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    if(ctx.state==="suspended") ctx.resume();
    const master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    const bpm=118, beat=60/bpm, t0=ctx.currentTime+0.04, beats=Math.ceil(secs/beat);
    function press(t){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(44,t+0.12);
      g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      o.connect(g).connect(master); o.start(t); o.stop(t+0.2);
      clack(ctx,t,270,0.3,0.07);
    }
    function ratchet(t){ clack(ctx,t,1400,0.18,0.04); clack(ctx,t+0.03,2100,0.12,0.03); }
    for(let b=0;b<beats;b++){ const t=t0+b*beat; press(t); ratchet(t+beat*0.5); if(b%4===2) ratchet(t+beat*0.75); }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, secs*1000+1000);
  }

  // Hard festival techno for the WIN — 4-on-floor kick + sub, 16th hats, claps, acid stab riff. Fire i gulvet.
  function playRave(secs){
    secs=secs||18;
    let ctx; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    if(ctx.state==="suspended") ctx.resume();
    const master=ctx.createGain(); master.gain.value=0.5;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    const nb=ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.5), ctx.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const bpm=124, beat=60/bpm, t0=ctx.currentTime+0.06, beats=Math.ceil(secs/beat);

    function kick(t){ const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine"; o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(46,t+0.1);
      g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.connect(g).connect(master); o.start(t); o.stop(t+0.22); }
    function snare(t){ const s=ctx.createBufferSource(); s.buffer=nb;
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1900; f.Q.value=0.8;
      const g=ctx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
      s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+0.19);
      const o=ctx.createOscillator(),og=ctx.createGain(); o.type="triangle"; o.frequency.value=190;
      og.gain.setValueAtTime(0.28,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(og).connect(master); o.start(t); o.stop(t+0.1); }
    // three quick hits, offset — a crowd clapping, not a drum machine
    function clapHand(t){ [0,0.012,0.026].forEach((d,i)=>{ const s=ctx.createBufferSource(); s.buffer=nb;
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1300+i*260; f.Q.value=1.1;
      const g=ctx.createGain(); const a=i===2?0.5:0.32;
      g.gain.setValueAtTime(a,t+d); g.gain.exponentialRampToValueAtTime(0.001,t+d+(i===2?0.2:0.06));
      s.connect(f).connect(g).connect(master); s.start(t+d); s.stop(t+d+0.22); }); }
    function tamb(t,accent){ const s=ctx.createBufferSource(); s.buffer=nb;
      const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=6200;
      const g=ctx.createGain(); const d=accent?0.16:0.05;
      g.gain.setValueAtTime(accent?0.3:0.16,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
      s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+d+0.02); }
    function chord(t,root){ [0,4,7].forEach((iv,i)=>{
      const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      const fr=root*Math.pow(2,iv/12);
      o.type="sawtooth"; o2.type="sawtooth"; o.frequency.value=fr; o2.frequency.value=fr*1.006;
      f.type="lowpass"; f.frequency.setValueAtTime(1500,t); f.frequency.exponentialRampToValueAtTime(700,t+beat*0.9);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.11,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+beat*0.95);
      o.connect(f); o2.connect(f); f.connect(g).connect(master);
      o.start(t); o2.start(t); o.stop(t+beat); o2.stop(t+beat); }); }
    function bassNote(t,fr){ const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="triangle"; o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+beat*0.55);
      o.connect(g).connect(master); o.start(t); o.stop(t+beat*0.6); }

    const prog=[196,196,220,165];           // G G A F — open and major, festival-ish
    for(let b=0;b<beats;b++){
      const t=t0+b*beat, ch=prog[Math.floor(b/2)%prog.length];
      kick(t);
      if(b%2===1){ snare(t); clapHand(t); }
      tamb(t+beat*0.5, b%4===3);
      tamb(t+beat*0.25,false);
      bassNote(t,ch/2);
      if(b%2===0) chord(t,ch);
      if(b%8===7) clack(ctx,t+beat*0.75,300,0.4,0.1);   // the press, still running
    }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, secs*1000+800);
  }

  // ---------- Easter eggs A–D. All on chrome only — pointer-events pass through to the grid. ----------
  function AC(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); if(c.state==="suspended")c.resume(); return c; }catch(e){ return null; } }
  // ---- Print-shop sound kit -------------------------------------------
  // The machine's square-wave bleeps belonged to the engine room. This sheet
  // is printed, so everything is paper, ink, rollers and press mechanics:
  // filtered noise for paper, short resonant bodies for metal, no chiptune.
  function noiseSrc(ctx,dur,curve){
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,curve===undefined?2:curve);
    const src=ctx.createBufferSource(); src.buffer=b; return src;
  }
  // a mechanism landing: noise transient through a resonant body
  function clack(ctx,t,freq,gain,dur){
    dur=dur||0.07; gain=gain===undefined?0.4:gain;
    const n=noiseSrc(ctx,dur,3.2);
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=7;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    n.connect(bp).connect(g).connect(ctx.destination); n.start(t); n.stop(t+dur+0.02);
  }
  // paper moving: broadband hiss with a moving highpass
  function riffle(ctx,t,dur,gain,rise){
    const n=noiseSrc(ctx,dur,1.1);
    const hp=ctx.createBiquadFilter(); hp.type="highpass";
    hp.frequency.setValueAtTime(rise?900:2600,t);
    hp.frequency.exponentialRampToValueAtTime(rise?5200:1200,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain===undefined?0.3:gain,t+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    n.connect(hp).connect(g).connect(ctx.destination); n.start(t); n.stop(t+dur+0.02);
  }
  // the shop bell on the counter
  function bell(ctx,t,f,gain,dur){
    dur=dur||0.9; gain=gain===undefined?0.22:gain;
    [[1,1],[2.76,0.5],[5.4,0.28]].forEach(([m,a])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f*m;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain*a,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur*(1/m));
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+0.05);
    });
  }
  // the roller spinning up and settling
  function revSound(){
    const ctx=AC(); if(!ctx) return; const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type="triangle"; f.type="lowpass";
    f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(2400,t+0.2);
    f.frequency.exponentialRampToValueAtTime(500,t+0.5);
    o.frequency.setValueAtTime(58,t); o.frequency.exponentialRampToValueAtTime(150,t+0.2);
    o.frequency.exponentialRampToValueAtTime(70,t+0.5);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.26,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.52);
    o.connect(f).connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.55);
    riffle(ctx,t+0.02,0.42,0.16,true);
    setTimeout(()=>{try{ctx.close();}catch(e){}},800);
  }

  // every UI tick is now the platen landing, pitched by the caller's argument
  function blip(freq){
    const ctx=AC(); if(!ctx) return; const t=ctx.currentTime;
    clack(ctx,t,Math.max(180,Math.min(3200,freq*0.9)),0.34,0.06);
    riffle(ctx,t,0.05,0.10,false);
    setTimeout(()=>{try{ctx.close();}catch(e){}},300);
  }

  // press jam: a mechanical buzzer, not a console alarm
  function alarmBip(){

      o.type="sawtooth"; o.frequency.value=118; f.type="lowpass"; f.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.01);
      g.gain.setValueAtTime(0.3,t+0.11); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(f).connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.16);
      clack(ctx,t,240,0.3,0.05);

  }

  function feedKonami(id){

  // factory klaxon on the wall, not a police car

    const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=1500;
    const ng=ctx.createGain(); ng.gain.value=0.5;

    el.dataset.ink=isFoil?1:padInk.toFixed(3);
    panel.appendChild(el);
    if(!isFoil){ padInk=Math.max(.3, padInk-0.12); }
    thud(); if(navigator.vibrate) navigator.vibrate(isFoil?[12,40,22]:18);

    // Keep holding and the stamp presses harder — it grows until you let go.
    el.addEventListener("animationend",ev=>{
      if(ev.animationName!=="stampslam") return;
      const base=parseFloat(el.dataset.ink);
      el.style.animation="none";
      el.style.opacity=(0.78*base).toFixed(3);
      if(growing===el){ growFrom=performance.now(); pressHarder(); }
      else el.style.transform=`translate(-50%,-50%) rotate(var(--rot)) scale(1)`;
    });
    growing=el;

    stampCount++;
    if(stampCount>=8) rePull();

    const px=e.clientX-r.left, py=e.clientY-r.top;
    stampFrom={x:e.clientX,y:e.clientY};
    stampTimer=setTimeout(()=>{ stampTimer=null; stampFrom=null; slamStamp(px,py); },560);
  });
  // A finger is never still. Only a real drag cancels the press — cancelling on
  // any pointermove at all made this unusable on touch.
  panel.addEventListener("pointermove",e=>{
    if(stampTimer===null||!stampFrom) return;
    if(Math.hypot(e.clientX-stampFrom.x, e.clientY-stampFrom.y) < 12) return;
    clearTimeout(stampTimer); stampTimer=null; stampFrom=null;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>
    panel.addEventListener(t,()=>{ clearTimeout(stampTimer); stampTimer=null; stampFrom=null;
                                   releasePress(); }));


  // ---------- L — crop-mark alignment: all four crosshairs within 3s ----------
  // Additive: the screws keep their existing tick-on-tap and hold-to-unscrew.
  (function(){
    let hits=new Set(), first=0;
    document.querySelectorAll(".screw").forEach((sc,i)=>{
      sc.addEventListener("click",()=>{
        if(partyActive || sc.classList.contains("hole")) return;
        const now=Date.now();
        if(now-first>3000){ hits.clear(); first=now; }
        hits.add(i);
        if(hits.size===4){
          hits.clear(); first=0;
          gridEl.classList.add("aligned"); blip(880);
          setTimeout(()=>gridEl.classList.remove("aligned"),2000);   // never stays square
        }
      });
    });
  })();

  // ---------- M — colour-bar calibration: swatches top to bottom ----------
  (function(){
    const bar=[document.querySelector(".knob.k1"), document.querySelector(".knob.k3"),
               document.querySelector(".tgl"), document.querySelector(".fader"),
               document.querySelector(".redbtn")].filter(Boolean);
    if(bar.length<5) return;
    const INKS=["#00b5e2","#111018","#ff2d72","#ffb25f","#ff6a00"];
    let step=0, last=0;
    bar.forEach((el,i)=>{
      el.addEventListener("click",()=>{
        if(partyActive) return;
        const now=Date.now();
        if(now-last>2200) step=0;                 // sequence times out
        last=now;
        if(i===step){ step++; if(step===bar.length){ step=0; runCalibration(); } }
        else step=(i===0?1:0);                    // wrong chip restarts cleanly
      });
    });
    function runCalibration(){
      INKS.forEach((c,i)=>setTimeout(()=>{
        const f=document.createElement("div");
        f.className="inkflood"; f.style.background=c;
        panel.appendChild(f); blip(340+i*90);
        setTimeout(()=>f.remove(),150);
      }, i*150));
      setTimeout(()=>{
        const ok=document.createElement("div");
        ok.className="stamp ink3"; ok.textContent="FARVER OK"; ok.dataset.t="FARVER OK";
        ok.style.setProperty("--rot","-6deg");
        ok.style.left="50%"; ok.style.top="50%"; ok.dataset.ink="1";
        panel.appendChild(ok); reInkPad();
        setTimeout(()=>{ ok.classList.add("lift");
                         setTimeout(()=>ok.remove(),520); },1500);
      }, INKS.length*150);
    }
  })();

  // ---------- Debug mode (?fejlfinding): Ny plade-knap (ADR-9). Not for participants. ----------
  if(params.has("fejlfinding")){
    const dbg=$("#dbg"); dbg.classList.add("on");
    const counts={}; for(let c=0;c<9;c++){ counts[c]=grid.filter(row=>row[c]!=null).length; }
    $("#dbginfo").textContent="pr. kol: "+Object.values(counts).join(" ");
    $("#newplate").addEventListener("click",()=>{
      if(!confirm("Ny plade? Overskriver den gemte plade OG alle kryds.")) return;
      grid=makePlate(); saveGrid(grid); marks=new Set(); saveMarks(marks);
      prevCompleteRows=0; render();
      const cc={}; for(let c=0;c<9;c++){ cc[c]=grid.filter(row=>row[c]!=null).length; }
      $("#dbginfo").textContent="pr. kol: "+Object.values(cc).join(" ");
    });
  }

  render();
})();
</script>
</body>
</html>
